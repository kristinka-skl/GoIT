<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="./page.css">
</head>
<body>
    <h1>
        Forms
    </h1>
    <div class="wrapper">
        <form name="user_form">
            <label for="form-username">Username</label>
            <div>
                <input 
                    type="text" 
                    id="form-username" 
                    name="user_name"
                    placeholder="Username"
                >
            </div>
            <label for="form-useremail">useremail</label>
            <div>
                <input 
                    type="email" 
                    id="form-useremail"
                    name="user_email"
                    placeholder="Useremail"
                    required
                    minlength="5"
                    maxlength="40"
                    
                >
            </div>
            <button type="submit" disabled>Submit</button>
        </form>
    </div>
</body>
</html>
